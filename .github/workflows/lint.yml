name: lint
on:
  push:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read

env:
  DEFAULT_PYTHON_VERSION: "3.11"
  UV_PYTHON_DOWNLOADS: never
jobs:
  flake8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Run flake8
        run: make flake8
  isort:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Run isort
        run: make isort-check
  pylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Run pylint
        run: make pylint
